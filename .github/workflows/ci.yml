name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: otel-components/k8spodlogreceiver/go.mod
          cache-dependency-path: otel-components/k8spodlogreceiver/go.sum

      - name: Cache vendor
        id: cache-vendor
        uses: actions/cache@v6
        with:
          path: otel-components/k8spodlogreceiver/vendor
          key: ${{ runner.os }}-go-vendor-${{ hashFiles('otel-components/k8spodlogreceiver/go.sum') }}

      - name: Vendor dependencies
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        working-directory: otel-components/k8spodlogreceiver
        run: go mod vendor

      - name: Test
        working-directory: otel-components/k8spodlogreceiver
        run: go test -v -mod=vendor ./...
  build-test:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Keep it just for test if build has been past
          push: false
          tags: collector:latest
