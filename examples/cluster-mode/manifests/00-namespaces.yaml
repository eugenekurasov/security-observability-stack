# Home of the collector and the debug gateway. `helm install
# --create-namespace` would create this too, but 04-otel-gateway.yaml is
# applied before the chart, so it has to exist by then.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    compliance.io/tenant: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    compliance.io/tenant: payments
---
apiVersion: v1
kind: Namespace
metadata:
  name: fraud-detection
  labels:
    compliance.io/tenant: fraud-detection
---
