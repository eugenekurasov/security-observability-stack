# Deployment mode.
#
#   cluster   — ClusterRole + ClusterRoleBinding; collector watches all
#               namespaces and can scrape node-level metrics. Requires a
#               platform/cluster-admin to install.
#
#   namespace — Role + RoleBinding scoped to `namespaces` below (defaults
#               to the release namespace). Tenant self-installable: only
#               needs admin rights in their own namespace(s).
#
mode: namespace

# Namespaces the collector is allowed to watch.
# Namespace mode: defaults to the Helm release namespace if empty.
# Cluster mode:   ignored — the collector watches all namespaces.
namespaces: []

# Attached as compliance.io/tenant label on every resource. Useful for
# attributing collector instances to a team or service in shared platforms.
tenantId: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Enable or disable individual observability signal types.
# Each flag independently controls both the RBAC permissions granted and
# the OTel Collector receiver/pipeline that is activated.
signals:
  logs:
    enabled: true
    # How far back to read when a new pod is first discovered (mirrors
    # `kubectl logs --since`). Prevents re-reading full available history
    # on restart.
    sinceSeconds: 300
    # Kubernetes label selector to restrict which pods are tailed.
    # Example: "app.kubernetes.io/part-of=payments"
    podLabelSelector: ""
    # Max number of log lines coalesced into a single pipeline push per
    # container stream. Batching amortizes per-line overhead at high line
    # rates (e.g. 10k lines/sec) instead of one push per line. Larger values
    # hold more memory per in-flight batch. 0 = use the receiver default (1000).
    maxBatchSize: 1000
    # Max time a partially-filled batch waits before being forwarded, so a
    # low-volume stream isn't held back until it fills maxBatchSize lines.
    # 0 = use the receiver default (200ms).
    flushInterval: 200ms
    # Max size, in bytes, of a single emitted log record body. Also bounds the
    # per-stream read buffer so a pathologically long line can't grow memory
    # without limit. A longer line is handled per maxLogSizeBehavior, never
    # silently dropped. 0 = use the receiver default (1048576 = 1 MiB).
    maxLogSize: 1048576
    # What to do with a log line longer than maxLogSize:
    #   split    - preserve all data by emitting the line as consecutive
    #              maxLogSize-sized records (default; nothing is lost).
    #   truncate - keep the first maxLogSize bytes and drop the rest of the line.
    maxLogSizeBehavior: split
    # Backoff applied when a per-container log stream fails and is reconnected.
    reconnectBackoff:
      initialInterval: 1s
      maxInterval: 30s
      # Total time to keep retrying a failing stream before giving up; 0 = retry forever.
      maxElapsedTime: 5m

  metrics:
    enabled: true
    # Scrape only pods that carry the prometheus.io/scrape: "true" annotation.
    # Set to false to scrape every pod in the target namespaces.
    scrapeAnnotated: true
    scrapeInterval: 30s
    # Cluster mode only: also collect kubelet / cAdvisor metrics from nodes.
    scrapeNodes: true

  events:
    enabled: true
    # Kubernetes Event objects are always in the same namespace as the
    # resource they describe (pod restarts, OOMKills, scheduling failures,
    # image pull errors, quota violations, etc.).
    #
    # In namespace mode:  only events from the tenant's own namespace(s) are
    #                     visible — node/PV/control-plane events are not.
    # In cluster mode:    events across all namespaces including kube-system
    #                     (node pressure, PV binding, etc.) are collected.
    #
    # Uses k8seventsreceiver from opentelemetry-collector-contrib — no custom
    # component required. The collector image does not need k8spodlogreceiver
    # for this signal type.

  traces:
    enabled: true
    grpcPort: 4317
    httpPort: 4318

  selfMonitoring:
    enabled: true
    # Port on which the collector exposes its own Prometheus metrics:
    # Go process memory/CPU, pipeline throughput, drop counts, etc.
    # When signals.metrics.enabled is true and scrapeAnnotated is true,
    # the collector will scrape itself automatically via the prometheus
    # receiver (the pod carries the prometheus.io/scrape annotation).
    metricsPort: 8888

collector:
  # Must be a custom OCB-built image that includes k8spodlogreceiver.
  # The upstream otel/opentelemetry-collector-contrib image works for
  # metrics and traces but does not include k8spodlogreceiver.
  # See otel-components/k8spodlogreceiver and the planned OCB manifest.
  image:
    repository: ghcr.io/eugenekurasov/security-observability-stack/collector
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  # Replicas > 1 is not yet safe: activeStreams tracking is in-process only.
  # HA requires distributed stream coordination (not yet implemented).
  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # All signals are forwarded to a single OTLP endpoint (gateway, backend, etc.).
  export:
    endpoint: "otel-gateway:4317"
    tls:
      # In-cluster gateway on a plaintext port. Transport security here is
      # expected to come from the mesh (mTLS) rather than from the exporter.
      # Set insecure: false and provide ca_file/cert_file when the gateway
      # terminates TLS itself.
      insecure: true

  # Processors applied to every pipeline. Order in the pipeline is fixed by the
  # template: memory_limiter first (so it can shed load before anything else
  # buffers), then k8sattributes (when self-monitoring is enabled), then batch
  # last (so it batches enriched data right before export).
  processors:
    # Drops data / applies backpressure when the collector approaches its memory
    # limit, protecting it from OOMKill. Percentages are of the container memory
    # limit (collector.resources.limits.memory), read from the cgroup — so these
    # track automatically if you resize the pod.
    memoryLimiter:
      # How often the processor checks current memory usage.
      checkInterval: 1s
      # Hard limit: at this % of the memory limit, data is refused until usage drops.
      limitPercentage: 80
      # Spike headroom subtracted from the hard limit to get the soft limit, so
      # a sudden burst between checks still leaves room before the hard limit.
      spikeLimitPercentage: 25
    # Groups records into fewer, larger export requests, amortizing per-request
    # overhead on the exporter and the downstream gateway.
    batch:
      # Max time a partial batch waits before being sent.
      timeout: 5s
      # Soft target batch size; a batch is sent once it reaches this many records.
      sendBatchSize: 8192
      # Hard cap that splits oversized batches; 0 = no upper bound.
      sendBatchMaxSize: 0
