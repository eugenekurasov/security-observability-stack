{{- $root := . -}}
{{- range $g := (include "observability-stack.groups" . | fromYamlArray) }}
{{- $v := include "observability-stack.groupValues" (dict "root" $root "group" $g) | fromYaml }}
{{- $signals := $g.signals }}
{{- $fullname := include "observability-stack.groupFullname" (dict "root" $root "group" $g) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "observability-stack.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $g.name }}
spec:
  replicas: {{ $v.collector.replicas }}
  selector:
    matchLabels:
      {{- include "observability-stack.groupSelectorLabels" (dict "root" $root "group" $g) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "observability-stack.groupSelectorLabels" (dict "root" $root "group" $g) | nindent 8 }}
      annotations:
        checksum/config: {{ include "observability-stack.collectorConfig" (dict "root" $root "values" $v "signals" $signals) | sha256sum }}
        {{- if $v.signals.selfMonitoring.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $v.signals.selfMonitoring.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
    spec:
      serviceAccountName: {{ include "observability-stack.serviceAccountName" $root }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: "{{ $v.collector.image.repository }}:{{ $v.collector.image.tag }}"
          imagePullPolicy: {{ $v.collector.image.pullPolicy }}
          args: ["--config=/etc/otelcol/collector.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          {{- if or (has "traces" $signals) $v.signals.selfMonitoring.enabled $v.healthCheck.enabled }}
          ports:
            {{- if has "traces" $signals }}
            - name: otlp-grpc
              containerPort: {{ $v.signals.traces.grpcPort }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ $v.signals.traces.httpPort }}
              protocol: TCP
            {{- end }}
            {{- if $v.signals.selfMonitoring.enabled }}
            - name: telemetry
              containerPort: {{ $v.signals.selfMonitoring.metricsPort }}
              protocol: TCP
            {{- end }}
            {{- if $v.healthCheck.enabled }}
            - name: health
              containerPort: {{ $v.healthCheck.port }}
              protocol: TCP
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: collector-config
              mountPath: /etc/otelcol
              readOnly: true
          {{- if $v.healthCheck.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          {{- end }}
          resources:
            {{- toYaml $v.collector.resources | nindent 12 }}
      volumes:
        - name: collector-config
          configMap:
            name: {{ $fullname }}
{{- end }}
